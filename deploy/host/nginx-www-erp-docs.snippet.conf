    # ERP 板块独立站（fd-erp 生成物，非官网五线内容）
    # 落点：/opt/fd/erp/site/index.html —— 与 erp.finddatatech.cloud 源站同一份文件
    # 放在 location / 之前只为可读；nginx 按前缀长度择优，/erp-docs/ 天然优先。
    location /erp-docs/ {
        alias /opt/fd/erp/site/;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=300" always;
    }
