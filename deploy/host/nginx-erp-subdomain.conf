# ERP 板块独立站 — erp.finddatatech.cloud
# 内容源：fd-erp/site/index.html（由 fd-erp/tools/gen_erp_docs.py 生成，勿手改该文件）
# 发布：scp fd-erp/site/index.html fd-deploy:/opt/fd/erp/site/index.html
# 形态：静态单页，无后端、无追踪；TLS 由前置 WAF 终止（本块只听 :80）。
server {
    server_name erp.finddatatech.cloud;
    root /opt/fd/erp/site;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "public, max-age=300" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    access_log /var/log/nginx/erp.finddatatech.cloud.access.log;
    error_log  /var/log/nginx/erp.finddatatech.cloud.error.log;
}
