# --- ERP 板块独立站 erp.finddatatech.cloud（2026-11-11）---
# 内容源：fd-erp/site/index.html（生成物，勿手改），部署在官方站源站 124.220.7.175
# /opt/fd/erp/site。边缘只做转发，不持有内容副本；TLS 由雷池站点证书终止。
#
# 绝对不要给这一个站点写 `bind`。Caddy 按"监听地址集"分组 server：单站点写
#   bind 127.0.0.1 172.22.222.1
# 会为这组地址单开一个 server，并把 172.22.222.1:8080 从共享的 :8080 server 里抢走。
# 雷池的目标地址恰好就是 172.22.222.1:8080 —— 抢走之后，其余 37 个 *.finddatatech.cloud
# 的请求全落到只有 1 条路由的 server 上，host 不匹配 → 返回**空 200**（不是 404/502）。
# 2026-11-11 这行加进去两次，平台整站白了两次。详见 README「坑 2」。
http://erp.finddatatech.cloud:8080 {
	reverse_proxy 124.220.7.175:80 {
		header_up X-Forwarded-Proto https
		header_up X-Forwarded-Port 443
	}
}
